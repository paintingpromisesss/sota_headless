services:
  sota-headless:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SOTA_LISTEN: 0.0.0.0:16698
      SOTA_PROXY_LISTEN: 0.0.0.0:2080
    ports:
      - "127.0.0.1:16698:16698"
      - "127.0.0.1:2080:2080"
    volumes:
      - ./bin:/app/bin
      - ./runtime:/app/runtime
      - ./state:/app/state
      - ./rule_sets:/app/rule_sets
    # Required for SOTA_MODE=TUN. For SOTA_MODE=Proxy these can be removed.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
