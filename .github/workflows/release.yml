name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: 7
            suffix: linux-arm
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: mips
            gomips: softfloat
            suffix: linux-mips
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            suffix: linux-mipsle
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          BIN="sota-headless-${{ matrix.suffix }}"
          go build \
            -tags nethttpomithttp2 \
            -ldflags="-s -w -X sota-headless/internal/config.AppVersion=${{ github.ref_name }}" \
            -trimpath \
            -o "bin/${BIN}" \
            ./cmd/sota-headless

          # Create UPX compressed variant
          case "${BIN}" in
            *.exe) UPX_BIN="${BIN%.exe}-upx.exe" ;;
            *)     UPX_BIN="${BIN}-upx" ;;
          esac
          cp "bin/${BIN}" "bin/${UPX_BIN}"
          upx --best --lzma "bin/${UPX_BIN}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sota-headless-${{ matrix.suffix }}
          path: bin/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
          make_latest: false
          body: |
            > **Experimental Pre-release (v1.1.0)**
            > Universal Linux installer with systemd support alongside OpenWrt procd, plus Windows service support.
            > Includes both standard and UPX-compressed variants for resource-constrained routers.

            ### Supported architectures
            | File (standard) | File (UPX-compressed) | Target |
            |-----------------|-----------------------|--------|
            | `sota-headless-linux-arm64` | `sota-headless-linux-arm64-upx` | MediaTek Filogic, RPi 4/5, Rockchip |
            | `sota-headless-linux-arm` | `sota-headless-linux-arm-upx` | MT7621 (ARMv7), older routers |
            | `sota-headless-linux-amd64` | `sota-headless-linux-amd64-upx` | x86/x64 routers |
            | `sota-headless-linux-mips` | `sota-headless-linux-mips-upx` | Atheros AR9xxx (big-endian) |
            | `sota-headless-linux-mipsle` | `sota-headless-linux-mipsle-upx` | MT7620/MT7628 (little-endian) |
            | `sota-headless-windows-amd64.exe` | `sota-headless-windows-amd64-upx.exe` | Windows x86_64 / x64 |
            | `sota-headless-windows-arm64.exe` | `sota-headless-windows-arm64-upx.exe` | Windows ARM64 |
